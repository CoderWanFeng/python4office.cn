<!doctype html>
<html><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1800px;height:766px;overflow:hidden;background:#06202a}
  .stage{position:relative;width:1800px;height:766px;background:url(261116-tencent-experthub-cover-v2-bg.jpg) right center/cover no-repeat;
    font-family:"Hiragino Sans GB","PingFang SC",sans-serif;color:#fff}
  .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,26,34,.96) 0%,rgba(5,26,34,.88) 40%,rgba(5,26,34,.35) 56%,rgba(5,26,34,0) 66%)}
  .copy{position:absolute;left:104px;top:0;height:766px;display:flex;flex-direction:column;justify-content:center}
  .brand{display:flex;align-items:center;gap:16px;margin-bottom:34px}
  .brand svg{width:56px;height:56px}
  .brand b{font-size:40px;font-weight:600;letter-spacing:2px}
  .brand i{font-style:normal;font-size:28px;color:#9fbacb;letter-spacing:1px;padding-left:16px;border-left:2px solid rgba(159,186,203,.45)}
  .brand .pill{margin-left:10px;font-size:24px;font-weight:600;color:#06202a;background:linear-gradient(90deg,#22D3EE,#34D399);
    padding:6px 16px;border-radius:999px}
  .h1{font-size:112px;font-weight:600;line-height:1.08;letter-spacing:2px;white-space:nowrap}
  .h1 em{font-style:normal;background:linear-gradient(90deg,#22D3EE,#34D399);-webkit-background-clip:text;background-clip:text;color:transparent}
  .h2{margin-top:20px;font-size:96px;font-weight:600;line-height:1.1;white-space:nowrap;display:flex;align-items:baseline}
  .h2 .num{font-size:178px;line-height:.9;margin:0 6px 0 14px;letter-spacing:-4px;
    background:linear-gradient(180deg,#FFE28A 0%,#FFC23D 55%,#F59E0B 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 22px rgba(255,180,40,.35))}
  .h2 .yuan{color:#FFC23D}
  .chips{display:flex;gap:16px;margin-top:34px}
  .chip{font-size:30px;font-weight:600;padding:12px 24px;border-radius:14px;background:rgba(255,255,255,.08);
    border:1.5px solid rgba(255,255,255,.22);white-space:nowrap}
  .chip.red{background:#E5322D;border-color:#E5322D}
  .chip b{color:#FFD24D}
</style></head>
<body><div class="stage"><div class="shade"></div>
<div class="copy">
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#34D399"/></linearGradient></defs>
      <circle cx="16" cy="16" r="13" stroke="url(#lg)" stroke-width="1.4" opacity=".38"/>
      <path d="M16 6.4 24.3 21.2 7.7 21.2Z" stroke="url(#lg)" stroke-width="1.5" stroke-linejoin="round" fill="url(#lg)" fill-opacity=".1"/>
      <circle cx="16" cy="6.4" r="3" fill="url(#lg)"/><circle cx="24.3" cy="21.2" r="3" fill="url(#lg)"/><circle cx="7.7" cy="21.2" r="3" fill="url(#lg)"/>
      <circle cx="16" cy="16" r="3.4" fill="#E8F4FB" opacity=".72"/>
    </svg>
    <b>智囊团</b><i>ExpertHub</i><span class="pill">腾讯官方</span>
  </div>
  <div class="h1">帮腾讯<em>教大模型</em></div>
  <div class="h2">签约就领<span class="num">100</span><span class="yuan">元</span></div>
  <div class="chips">
    <span class="chip red">首单再奖 <b>200</b> 元</span>
    <span class="chip">一道题最高 <b>2100</b> 元</span>
    <span class="chip">11.18 截止</span>
  </div>
</div></div></body></html>
